<form action="https://api.web3forms.com/submit" method="POST" class="contact-form">

    <!-- Web3Forms Access Key -->
    <input
        type="hidden"
        name="access_key"
        value="f20f8971-f3f0-4c65-a8e5-01a3aafd57bd"
    >

    <!-- Email Subject -->
    <input
        type="hidden"
        name="subject"
        value="New Contact Message - Fatima Iqbal Portfolio"
    >

    <!-- From Name -->
    <input
        type="hidden"
        name="from_name"
        value="Fatima Iqbal Portfolio"
    >


    <div class="form-group">
        <label for="name">Your Name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >
    </div>


    <div class="form-group">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
    </div>


    <div class="form-group">
        <label for="message">Message</label>

        <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message..."
            required
        ></textarea>
    </div>


    <button type="submit" class="send-btn">
        Send Message
    </button>

</form>
